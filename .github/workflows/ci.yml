name: CI

on:
  push:
  pull_request:

jobs:
  runtime:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: runtime/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  exporter-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          args: check
      - uses: astral-sh/ruff-action@v3
        with:
          args: format --check

  exporter-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Minimum supported (SPEC §2) and latest LTS.
        blender: ["4.2.3", "5.2.2"]
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libxi6 libxxf86vm1 libxfixes3 libxrender1 libxkbcommon0 libsm6 libgl1 libegl1
      - name: Cache Blender
        id: cache
        uses: actions/cache@v4
        with:
          path: blender
          key: blender-${{ matrix.blender }}-linux-x64
      - name: Download Blender
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          series=$(echo "${{ matrix.blender }}" | cut -d. -f1,2)
          curl -fsSL "https://download.blender.org/release/Blender${series}/blender-${{ matrix.blender }}-linux-x64.tar.xz" -o blender.tar.xz
          mkdir blender && tar -xf blender.tar.xz -C blender --strip-components=1
      - name: Run exporter tests
        run: ./blender/blender -b --factory-startup --python exporter/tests/run_tests.py
