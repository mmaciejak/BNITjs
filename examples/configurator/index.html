<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Material Configurator</title>
    <link rel="icon" href="data:," />
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, sans-serif;
      }
      body {
        margin: 0;
        background: #15161a;
        color: #e8e8ea;
        display: grid;
        grid-template-columns: 1fr 280px;
        height: 100vh;
      }
      #view canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      aside {
        padding: 20px;
        border-left: 1px solid #2a2c33;
        overflow: auto;
      }
      h1 {
        font-size: 16px;
        margin: 0 0 4px;
      }
      p.note {
        font-size: 12px;
        color: #9a9ca5;
        margin: 0 0 16px;
      }
      label {
        display: block;
        font-size: 13px;
        margin: 14px 0 6px;
      }
      input[type="range"] {
        width: 100%;
      }
      output {
        float: right;
        font-variant-numeric: tabular-nums;
        color: #9a9ca5;
      }
      @media (max-width: 700px) {
        body {
          grid-template-columns: 1fr;
          grid-template-rows: 60vh auto;
        }
        aside {
          border-left: 0;
          border-top: 1px solid #2a2c33;
        }
      }
    </style>
  </head>
  <body>
    <div id="view"></div>
    <aside>
      <h1>Material configurator</h1>
      <p class="note">
        Procedural Blender material, evaluated live with three.js TSL. Controls
        come from the material's <code>$</code>-labelled nodes.
      </p>
      <div id="controls"></div>
    </aside>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
