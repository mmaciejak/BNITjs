<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>model-viewer Fallback</title>
    <link rel="icon" href="data:," />
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, sans-serif;
        --bg: #15161a;
        --panel: #1f2026;
        --text: #e6e6e9;
        --muted: #9a9ba3;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        height: 100vh;
        display: grid;
        grid-template-columns: 1fr 1fr;
        grid-template-rows: auto 1fr auto;
      }
      header {
        grid-column: 1 / -1;
        padding: 12px 16px;
        color: var(--muted);
        font-size: 14px;
      }
      .pane {
        position: relative;
        min-height: 0;
        border-top: 1px solid var(--panel);
      }
      .pane + .pane {
        border-left: 1px solid var(--panel);
      }
      .pane h2 {
        position: absolute;
        top: 8px;
        left: 12px;
        margin: 0;
        font-size: 13px;
        font-weight: 600;
        z-index: 1;
      }
      model-viewer,
      .pane canvas {
        display: block;
        width: 100%;
        height: 100%;
        background: var(--bg);
      }
      #controls {
        grid-column: 2;
        display: flex;
        gap: 16px;
        flex-wrap: wrap;
        align-items: center;
        padding: 10px 16px;
        background: var(--panel);
        font-size: 13px;
      }
      #controls label {
        display: flex;
        gap: 6px;
        align-items: center;
      }
      @media (max-width: 720px) {
        body {
          grid-template-columns: 1fr;
          grid-template-rows: auto 1fr 1fr auto;
        }
        .pane + .pane {
          border-left: 0;
        }
        #controls {
          grid-column: 1;
        }
      }
    </style>
  </head>
  <body>
    <header>
      One file, <code>painted.glb</code>. Left: what a viewer without BNITjs shows (the baked PBR
      fallback). Right: the same file in three.js with BNITjs, evaluated live.
    </header>
    <section class="pane" id="baked">
      <h2 id="baked-title">model-viewer (baked)</h2>
    </section>
    <section class="pane" id="live">
      <h2>three.js + BNITjs (live)</h2>
    </section>
    <div id="controls"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
