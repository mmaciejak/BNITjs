schema_version = "1.0.0"

id = "bnitjs"
version = "0.0.0"
name = "BNITjs"
tagline = "Export procedural shader node graphs for live three.js materials"
maintainer = "Maciej <maciejak28@gmail.com>"
type = "add-on"
website = "https://github.com/mmaciejak/BNITjs"

blender_version_min = "4.2.0"

# AGPL-3.0 is compatible with Blender's GPL (GPLv3 §13).
license = ["SPDX:AGPL-3.0-or-later"]

tags = ["Import-Export", "Material"]

[permissions]
files = "Write glTF files and baked textures to disk"

[build]
paths_exclude_pattern = [
  "__pycache__/",
  "*.pyc",
  ".DS_Store",
  "/tests/",
]
